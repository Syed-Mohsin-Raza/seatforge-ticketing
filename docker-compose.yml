services:
  postgres:
    image: postgres:18-alpine
    container_name: seatforge-postgres
    environment:
      POSTGRES_DB: seatforge
      POSTGRES_USER: seatforge
      POSTGRES_PASSWORD: seatforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatforge -d seatforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: