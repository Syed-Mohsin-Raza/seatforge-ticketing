services:
  postgres:
    image: postgres:18-alpine
    container_name: seatforge-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: seatforge
      POSTGRES_USER: seatforge
      POSTGRES_PASSWORD: seatforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatforge -d seatforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: seatforge-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20


  hold-svc:
    build:
      context: ./backend/hold-svc
      dockerfile: Dockerfile
    container_name: seatforge-hold-svc
    environment:
      DATABASE_URL: postgres://seatforge:seatforge@postgres:5432/seatforge?sslmode=disable
      GRPC_PORT: 9090
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data: