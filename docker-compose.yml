services:
  postgres:
    image: postgres:18-alpine
    container_name: seatforge-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: seatforge
      POSTGRES_USER: seatforge
      POSTGRES_PASSWORD: seatforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatforge -d seatforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seatforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  hold-svc:
    build:
      context: ./backend/hold-svc
      dockerfile: Dockerfile
    container_name: seatforge-hold-svc
    environment:
      DATABASE_URL: postgres://seatforge:seatforge@postgres:5432/seatforge?sslmode=disable
      GRPC_PORT: 9090
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: