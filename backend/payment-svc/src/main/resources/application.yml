server:
  port: 0   # no HTTP server; gRPC only

spring:
  application:
    name: payment-svc
  main:
    banner-mode: "off"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/payment
    schemas: payment
    default-schema: payment
    create-schemas: true
    table: flyway_schema_history_payment

seatforge:
  payment:
    grpc:
      port: 9091

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never