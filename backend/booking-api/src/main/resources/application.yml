server:
  port: 8080

spring:
  application:
    name: booking-api
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:postgresql://localhost:5432/seatforge
    username: seatforge
    password: seatforge
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never