server:
  port: 8080

spring:
  application:
    name: booking-api
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:postgresql://localhost:5432/seatforge
    username: seatforge
    password: seatforge
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

seatforge:
  events:
    publisher: sns
    topic-arn: arn:aws:sns:us-east-1:000000000000:seatforge-bookings
  aws:
    region: us-east-1
    # endpoint and credentials are set in application-dev.yml
  jwt:
    # WARNING: This fallback is intentionally invalid and will cause startup to fail.
    # Set SEATFORGE_JWT_SECRET to a random value of at least 32 bytes.
    # Generate one with: openssl rand -base64 48
    secret: ${SEATFORGE_JWT_SECRET:dev-secret-change-me}
    ttl-minutes: 60